<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureWebChat | Encrypted Room</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      height: 100vh;
      overflow: hidden;
      color: #e0e0e0;
    }

    #destructionCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      display: none;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 1400px;
      margin: 0 auto;
      background: #0a0a0f;
    }

    .chat-header {
      background: rgba(10, 10, 15, 0.95);
      backdrop-filter: blur(20px);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 212, 255, 0.2);
      flex-wrap: wrap;
      gap: 0.8rem;
      flex-shrink: 0;
    }

    .room-info {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .room-badge {
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid rgba(0, 212, 255, 0.3);
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-family: monospace;
    }

    .room-code {
      font-family: 'Courier New', monospace;
      font-size: 1.2rem;
      letter-spacing: 2px;
      background: rgba(0, 0, 0, 0.5);
      padding: 0.3rem 1rem;
      border-radius: 8px;
      color: #00d4ff;
      border: 1px solid rgba(0, 212, 255, 0.3);
    }

    .encryption-badge {
      display: flex;
      gap: 0.5rem;
      font-size: 0.65rem;
    }

    .enc-badge {
      background: rgba(0, 212, 255, 0.1);
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      font-family: monospace;
    }

    .user-stats {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .online-count {
      background: rgba(0, 212, 255, 0.1);
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .destroy-btn {
      background: rgba(255, 0, 110, 0.15);
      border: 1px solid rgba(255, 0, 110, 0.4);
      color: #ff006e;
      padding: 0.5rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .destroy-btn:hover {
      background: rgba(255, 0, 110, 0.3);
      transform: scale(1.02);
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: linear-gradient(180deg, #0a0a0f 0%, #0d0d14 100%);
    }

    .messages-area::-webkit-scrollbar {
      width: 5px;
    }

    .messages-area::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
    }

    .messages-area::-webkit-scrollbar-thumb {
      background: #00d4ff;
      border-radius: 10px;
    }

    .message {
      display: flex;
      animation: messageSlideIn 0.3s ease;
    }

    @keyframes messageSlideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.sent {
      justify-content: flex-end;
    }

    .message.sent .message-bubble {
      background: linear-gradient(135deg, #00d4ff, #0099cc);
      color: #000;
      border-bottom-right-radius: 4px;
    }

    .message.sent .message-sender {
      color: rgba(0, 0, 0, 0.7);
      text-align: right;
    }

    .message.sent .message-time {
      color: rgba(0, 0, 0, 0.5);
      text-align: right;
    }

    .message.received {
      justify-content: flex-start;
    }

    .message.received .message-bubble {
      background: rgba(30, 30, 45, 0.9);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-bottom-left-radius: 4px;
    }

    .message.received .message-sender {
      color: #00d4ff;
    }

    .message.received .message-time {
      color: #606080;
    }

    .message-bubble {
      max-width: 70%;
      padding: 0.6rem 1rem;
      border-radius: 18px;
      word-wrap: break-word;
    }

    .message-sender {
      font-size: 0.7rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .message-text {
      font-size: 0.9rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .message-time {
      font-size: 0.55rem;
      margin-top: 0.3rem;
    }

    .system-message {
      text-align: center;
      color: #ffaa00;
      font-size: 0.7rem;
      padding: 0.3rem;
      background: rgba(255, 170, 0, 0.05);
      border-radius: 20px;
      margin: 0.5rem 0;
      animation: fadeIn 0.3s ease;
    }

    .typing-indicator {
      font-size: 0.7rem;
      color: #888;
      padding: 0.3rem 0.5rem;
      font-style: italic;
      opacity: 0;
      transition: opacity 0.3s;
      flex-shrink: 0;
      height: 30px;
    }

    .input-area {
      background: rgba(10, 10, 15, 0.95);
      backdrop-filter: blur(20px);
      padding: 1rem;
      border-top: 1px solid rgba(0, 212, 255, 0.1);
      flex-shrink: 0;
    }

    .message-input-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    #messageInput {
      flex: 1;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 212, 255, 0.3);
      border-radius: 12px;
      padding: 0.8rem 1rem;
      color: #e0e0e0;
      font-size: 0.9rem;
      font-family: inherit;
      transition: all 0.2s;
    }

    #messageInput:focus {
      outline: none;
      border-color: #00d4ff;
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
    }

    .media-buttons {
      display: flex;
      gap: 0.5rem;
    }

    .media-btn {
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid rgba(0, 212, 255, 0.3);
      padding: 0.8rem;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }

    .media-btn:hover {
      background: rgba(0, 212, 255, 0.3);
      transform: scale(1.05);
    }

    #sendBtn {
      background: linear-gradient(135deg, #00d4ff, #0099cc);
      border: none;
      padding: 0.8rem 1.8rem;
      border-radius: 12px;
      color: #000;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    #sendBtn:hover {
      transform: scale(1.02);
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
    }

    @media (max-width: 768px) {
      .message-bubble {
        max-width: 85%;
      }
      .media-buttons {
        gap: 0.3rem;
      }
      .media-btn {
        padding: 0.8rem;
      }
      .room-code {
        font-size: 0.9rem;
        letter-spacing: 1px;
      }
      .chat-header {
        padding: 0.75rem 1rem;
      }
      .encryption-badge {
        display: none;
      }
    }
  </style>
</head>
<body>
  <canvas id="destructionCanvas"></canvas>
  
  <div class="chat-container">
    <div class="chat-header">
      <div class="room-info">
        <div class="room-badge">🔐 SECURE CHANNEL</div>
        <div class="room-code" id="roomCodeDisplay">------</div>
        <div class="encryption-badge">
          <span class="enc-badge">XChaCha20</span>
          <span class="enc-badge">X25519</span>
        </div>
      </div>
      <div class="user-stats">
        <div class="online-count" id="userCount">
          <span>👥</span> <span id="userCountValue">1</span> online
        </div>
        <button class="destroy-btn" id="exitBtn">💣 DESTROY ROOM</button>
      </div>
    </div>
    
    <div class="messages-area" id="messagesArea">
      <div class="system-message">🔐 Secure connection established. End-to-end encrypted.</div>
    </div>
    
    <div class="typing-indicator" id="typingIndicator"></div>
    
    <div class="input-area">
      <div class="message-input-row">
        <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off">
        <div class="media-buttons">
          <button class="media-btn" id="imageBtn" title="Send Image">📷</button>
          <button class="media-btn" id="fileBtn" title="Send File">📎</button>
          <button class="media-btn" id="voiceBtn" title="Voice Note">🎙️</button>
        </div>
        <button id="sendBtn">SEND</button>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/libsodium-wrappers@0.7.13/dist/libsodium-wrappers.min.js"></script>
  <script src="/js/crypto.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
