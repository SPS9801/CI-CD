name: Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/CI-CD || git clone https://github.com/SPS9801/CI-CD.git
            cd /home/ubuntu/CI-CD
            git pull origin main
            cd /home/ubuntu/CI-CD/.github/securewebchat
            docker compose down
            docker compose up -d --build