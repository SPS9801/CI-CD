name: Deploy to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }} # तुम्हारा Elastic IP
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }} #.pem का content
          script: |
            cd ~/myapp
            git pull origin main
            docker-compose down
            docker-compose up -d --build
